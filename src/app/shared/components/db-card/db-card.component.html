<!-- Dasboard Card -->
<div class="bg-white rounded-lg shadow-sm p-6">
  <div class="flex items-center">
    <div
      class="p-3 rounded-full"
      [ngClass]="[dbCardConfig()?.bgColor, dbCardConfig()?.textColor]"
    >
      <!-- Svg Icon -->
      <svg
        class="w-6 h-6"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          [attr.d]="dbCardConfig()?.svgPath"
        ></path>
      </svg>
    </div>
    <div class="ml-4">
      <!-- Title -->
      <h3 class="text-gray-500 text-sm">{{ dbCardConfig()?.title }}</h3>
      <!-- Value -->
      <p class="text-2xl font-semibold text-gray-800">
        {{ dbCardConfig()?.value }}
      </p>
    </div>
  </div>
</div>
